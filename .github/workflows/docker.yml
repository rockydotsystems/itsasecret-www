name: Docker Hub

# Publishes itsasecret/web to Docker Hub:
#   push to main -> itsasecret/web:latest (+ :main, :<sha>)
#   tag v1.2.3   -> itsasecret/web:1.2.3 (+ :1.2, :1)
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with Read & Write, created under Account Settings > Security).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-hub
  cancel-in-progress: false

jobs:
  build:
    name: Build and push itsasecret/web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 for ARM servers / Apple Silicon; amd64 for everything else.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: itsasecret/web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
